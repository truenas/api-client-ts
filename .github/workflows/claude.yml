name: Claude Review

# The review itself now lives in iXsystems/ux-github-workflows, as
# claude-review.yml. It is the same one this repo built — schema, rubric,
# threshold gate, thread history, stale banner — moved so webui,
# truenas-ui-components and truenas-connect/ui can call it too, and so a change
# to the rubric or the gate happens once rather than four times.
#
# What moved out of this repo with it:
#   .github/review-schema.json        -> review/schema.json there
#   .github/scripts/*.mjs             -> review/*.mjs there
#   the severity rubric               -> review/rubric.md there
#   .github/workflows/check-team.yml  -> check-member.yml there, called by it
#
# `.claude/review-prompt.md` stays here, and is what this file's `prompt-file`
# input points at by default. It says what to look for in *this* codebase; the
# shared rubric is appended after it and says how to grade and report what turns
# up. Do not put severity levels back in it — the gate scores the shared ones.
#
# Reports as `review / <job names in ux-github-workflows>` — two checks, since
# the shared workflow runs the write-access gate as a job of its own, replacing
# `check-team / Check Team Membership` and `review`. Branch protection matches
# those whole strings, so the shared workflow's job names are API: renaming one
# there silently stops the check reporting here. A required check that never
# reports does not fail, it stays pending — the PR is unmergeable with nothing
# red on it to explain why, which is also what happens to any required-check
# setting still naming the old ones.

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  review:
    uses: iXsystems/ux-github-workflows/.github/workflows/claude-review.yml@master
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    secrets:
      # Both are mapped on purpose, and the shared workflow prefers the token.
      # `UX_CLAUDE_CODE_OAUTH_TOKEN` is an org secret granted per repository:
      # where the grant is missing it resolves to the empty string rather than
      # failing, so the API key below covers that case and this repo moves to
      # subscription billing on its own once the grant lands. Drop the key line
      # when API billing is retired, not before.
      claude-code-oauth-token: ${{ secrets.UX_CLAUDE_CODE_OAUTH_TOKEN }}
      anthropic-api-key: ${{ secrets.CLAUDE_API_KEY }}
