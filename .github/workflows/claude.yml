name: Claude Review
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
jobs:
  check-team:
    permissions:
      contents: read
    uses: ./.github/workflows/check-team.yml

  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-team]
    if: |
      needs.check-team.outputs.is_member == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-claude')
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Automatic PR Review
        id: review
        uses: anthropics/claude-code-action@v1.0.133
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          # No track_progress. It forces the action's "tag" mode, which replaces
          # allowedTools with a hardcoded list (Glob/Grep/LS/Read, three
          # mcp__github_ci__* tools, update_claude_comment, and four git
          # commands) and filters anything we add down to `mcp__github_`-prefixed
          # tools. Nothing in that list can emit structured output, so
          # --json-schema asked for a result the model had no way to produce: it
          # could neither finish nor fail, and ran until the job timed out.
          # Unchanged as of v1.0.187, so a version bump does not fix it.
          #
          # Agent mode passes allowedTools through untouched — but it creates no
          # tracking comment, so the review has to post itself. gh is how the
          # action's own examples/pr-review-comprehensive.yml does it.
          claude_args: |
            --model claude-opus-5
            --json-schema .github/review-schema.json
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          # No use_sticky_comment either. Its only consumer is
          # createInitialComment(), which is called from src/modes/tag/index.ts
          # and nowhere else — so outside tag mode it does nothing. Leaving it
          # set would describe behaviour this workflow does not have.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request using the guidelines below.
            It should be already checked out in the current directory.

            Post the prose review as a PR comment with `gh pr comment`. The
            structured output is separate and is what the gate reads; posting
            one is not a substitute for returning the other.

            {{file:.claude/review-prompt.md}}

      - name: Enforce review threshold
        # always(): a review step that fails must not skip the gate, or a broken
        # reviewer reads as a clean bill of health.
        if: always()
        env:
          FINDINGS: ${{ steps.review.outputs.structured_output }}
        run: node .github/scripts/check-review-threshold.mjs
