name: Validate PR Title

# The pattern now lives in iXsystems/ux-github-workflows, shared with
# truenas-ui-components — the other repo releasing off a squashed PR title.
#
# **`.releaserc.json` still has to match it.** A squash merge uses this title as
# the commit subject, and semantic-release parses it with
# `parserOpts.headerPattern`. If the two disagree, a PR merges green and
# publishes nothing. The shared pattern is:
#
#   ^(?:[^:]+ / )?(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\(([^)]+)\))?!?: (.+)$
#
# which is what this repo's .releaserc.json already carries, in both
# `headerPattern` and (with `!:`) `breakingHeaderPattern`. Changing one without
# the other is the failure mode.
#
# scripts/release-config.spec.mts reads that pattern line out of this comment
# and asserts .releaserc.json agrees with it, so keeping the two local halves in
# step is caught. What is not caught is the shared repo changing its pattern
# without this comment following — that one is on you.
#
# Reports as "pr-title / <job name in ux-github-workflows>" now, rather than as
# a single check named by this file. Branch protection matches that whole string
# literally, so the shared workflow's job name is API — renaming it there
# silently stops this check reporting here. Named as a shape rather than spelled
# out, because the shared repo's .github/workflows/ is not in the sparse
# checkout the review runs against: a copy here cannot be checked against the
# original by anything local, and one of the two strings claude.yml used to
# spell out turned out to be wrong.

on:
  pull_request_target:
    types: [opened, edited, synchronize]

jobs:
  pr-title:
    permissions:
      pull-requests: read
    uses: iXsystems/ux-github-workflows/.github/workflows/pr-title.yml@master
