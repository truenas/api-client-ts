name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the release job widens its own permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs — never cancel a push to main, whose release
  # job publishes to npm before tagging (a mid-publish cancel would leave npm
  # published with no matching git tag/release).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      # setup-node + corepack + yarn cache + `yarn install --immutable`, in the
      # one order that works. The local version had setup-node's own
      # `cache: yarn`, which shells out to yarn before Corepack has run — it
      # either fails or caches Yarn 1's directory for a Yarn 4 repo. The shared
      # action resolves the folder with `yarn config get cacheFolder` after
      # Corepack instead.
      - uses: iXsystems/ux-github-workflows/.github/actions/prepare@master
        with:
          node-version: ${{ matrix.node }} # the matrix is the point here; floating majors stay floating
          yarn-cache: 'true'
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - run: yarn check:dist
      - run: yarn check:package
      - run: yarn docs:check # validates doc comments ({@link} targets etc.) without rendering

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write # create git tags + GitHub releases
      issues: write # semantic-release comments on released issues
      pull-requests: write # semantic-release comments on released PRs
      id-token: write # npm publish provenance
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No node-version: this takes the shared pin (24.13.1) rather than
      # floating on 24. The verify matrix above is where Node versions are
      # deliberately varied; the job that publishes should not drift.
      - uses: iXsystems/ux-github-workflows/.github/actions/prepare@master
        with:
          yarn-cache: 'true'
      - run: yarn build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # semantic-release exits 0 whether or not it published; a release is
      # detected by the version tag it creates on HEAD.
      - id: check
        name: Detect published release
        run: |
          git fetch --tags --quiet origin
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: Publish docs
    needs: release
    # Deploy docs only when a release was actually published, so the public
    # site never drifts ahead of what's installable from npm.
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
